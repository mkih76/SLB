version: '3.8'

services:
  web:
    build: .
    ports:
      - "8790:8790"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - FLASK_ENV=production
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8790/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

