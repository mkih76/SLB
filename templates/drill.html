<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专项训练 - 申论帮</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .drill-container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .drill-header { text-align: center; margin-bottom: 30px; }
        .drill-header h1 { font-size: 24px; color: #1A3A6B; }
        .type-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 30px; }
        .type-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .type-card:hover { border-color: #1A3A6B; box-shadow: 0 2px 8px rgba(26,58,107,0.1); transform: translateY(-2px); }
        .type-card.active { border-color: #1A3A6B; background: #f0f5ff; }
        .type-name { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 8px; }
        .type-level { font-size: 13px; color: #C9A84C; margin-bottom: 4px; }
        .type-score { font-size: 22px; font-weight: 700; color: #1A3A6B; }
        .type-attempts { font-size: 12px; color: #999; margin-top: 4px; }
        .section-title { font-size: 18px; font-weight: 600; color: #1A3A6B; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #1A3A6B; }
        .recommend-list { display: flex; flex-direction: column; gap: 12px; }
        .recommend-item { background: #fff; border: 1px solid #e8e8e8; border-radius: 6px; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
        .recommend-info { flex: 1; }
        .recommend-title { font-size: 15px; font-weight: 500; color: #333; }
        .recommend-meta { font-size: 12px; color: #999; margin-top: 4px; }
        .btn-drill { background: #1A3A6B; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-drill:hover { background: #2a5298; }
        .progress-chart { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; padding: 20px; margin-top: 20px; min-height: 200px; }
        .progress-bar { height: 8px; background: #e8e8e8; border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #1A3A6B, #C9A84C); border-radius: 4px; transition: width 0.3s; }
        .empty-state { text-align: center; padding: 40px; color: #999; }
        .history-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .history-table th, .history-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e8e8e8; font-size: 14px; }
        .history-table th { background: #f5f5f5; color: #666; font-weight: 500; }
        .score-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: 600; font-size: 13px; }
        .score-high { background: #e6f7e6; color: #52c41a; }
        .score-mid { background: #fff7e6; color: #fa8c16; }
        .score-low { background: #fff1f0; color: #f5222d; }
    </style>
</head>
<body>
    <div class="drill-container">
        <div class="drill-header">
            <h1>专项训练</h1>
            <p style="color:#666;">选择题型，针对性提升</p>
        </div>

        <!-- 五题型卡片 -->
        <div class="type-grid" id="typeGrid"></div>

        <!-- 推荐练习 -->
        <div id="recommendSection" style="display:none;">
            <div class="section-title">推荐练习</div>
            <div class="recommend-list" id="recommendList"></div>
        </div>

        <!-- 进步趋势 -->
        <div id="progressSection" style="display:none;">
            <div class="section-title">进步趋势</div>
            <div class="progress-chart" id="progressChart">
                <canvas id="trendCanvas" width="960" height="200"></canvas>
            </div>
        </div>

        <!-- 训练历史 -->
        <div id="historySection" style="display:none;">
            <div class="section-title">训练历史</div>
            <table class="history-table">
                <thead>
                    <tr><th>试卷</th><th>题号</th><th>得分</th><th>时间</th></tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>

    <script>
    const API = '/api/drill';
    const token = localStorage.getItem('token');
    let currentType = null;

    const headers = () => ({'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'});

    async function loadStats() {
        const res = await fetch(API + '/types', {headers: headers()});
        const data = await res.json();
        if (!data.data) return;
        const types = data.data.types;
        const grid = document.getElementById('typeGrid');
        grid.innerHTML = '';
        const order = ['guina','zonghe','duice','zhixing','zuowen'];
        const names = {'guina':'归纳概括','zonghe':'综合分析','duice':'提出对策','zhixing':'贯彻执行','zuowen':'大作文'};
        const levels = {'bronze':'青铜','silver':'白银','gold':'黄金','platinum':'铂金','diamond':'钻石'};
        for (const t of order) {
            const s = types[t] || {total_attempts:0, avg_score:0, level:'bronze'};
            const card = document.createElement('div');
            card.className = 'type-card' + (currentType === t ? ' active' : '');
            card.onclick = () => selectType(t);
            card.innerHTML = '<div class="type-name">' + names[t] + '</div>' +
                '<div class="type-level">' + (levels[s.level]||'青铜') + '段位</div>' +
                '<div class="type-score">' + (s.avg_score || '--') + '</div>' +
                '<div class="type-attempts">练习' + s.total_attempts + '次</div>';
            grid.appendChild(card);
        }
    }

    async function selectType(type) {
        currentType = type;
        document.querySelectorAll('.type-card').forEach((c,i) => {
            c.classList.toggle('active', ['guina','zonghe','duice','zhixing','zuowen'][i] === type);
        });
        await Promise.all([loadRecommend(type), loadProgress(type), loadHistory(type)]);
    }

    async function loadRecommend(type) {
        const sec = document.getElementById('recommendSection');
        const list = document.getElementById('recommendList');
        const res = await fetch(API + '/recommend?type=' + type, {headers: headers()});
        const data = await res.json();
        if (!data.data || !data.data.items.length) {
            sec.style.display = 'none'; return;
        }
        sec.style.display = 'block';
        list.innerHTML = '';
        for (const item of data.data.items) {
            const div = document.createElement('div');
            div.className = 'recommend-item';
            div.innerHTML = '<div class="recommend-info">' +
                '<div class="recommend-title">' + (item.paper_title||'') + '</div>' +
                '<div class="recommend-meta">' + (item.question_text||'').substring(0,60) + '...' +
                ' | 难度: ' + '★'.repeat(item.difficulty||3) + '</div></div>' +
                '<a href="/exam/' + item.pid + '/' + item.qid + '" class="btn-drill">开始练习</a>';
            list.appendChild(div);
        }
    }

    async function loadProgress(type) {
        const sec = document.getElementById('progressSection');
        const res = await fetch(API + '/progress?type=' + type, {headers: headers()});
        const data = await res.json();
        if (!data.data || !data.data.trend.length) { sec.style.display = 'none'; return; }
        sec.style.display = 'block';
        drawChart(data.data.trend);
    }

    function drawChart(trend) {
        const canvas = document.getElementById('trendCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.parentElement.clientWidth - 40;
        canvas.height = 200;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!trend.length) return;
        const max = 100, padding = 40;
        const w = canvas.width - padding * 2;
        const h = canvas.height - padding * 2;
        // grid
        ctx.strokeStyle = '#e8e8e8'; ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
            const y = padding + (h / 4) * i;
            ctx.beginPath(); ctx.moveTo(padding, y); ctx.lineTo(padding + w, y); ctx.stroke();
            ctx.fillStyle = '#999'; ctx.font = '11px sans-serif';
            ctx.fillText(Math.round(max - (max/4)*i), 5, y + 4);
        }
        // line
        ctx.strokeStyle = '#1A3A6B'; ctx.lineWidth = 2; ctx.beginPath();
        trend.forEach((p, i) => {
            const x = padding + (w / Math.max(trend.length - 1, 1)) * i;
            const y = padding + h - (p.score / max) * h;
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        });
        ctx.stroke();
        // dots
        trend.forEach((p, i) => {
            const x = padding + (w / Math.max(trend.length - 1, 1)) * i;
            const y = padding + h - (p.score / max) * h;
            ctx.fillStyle = '#1A3A6B'; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#333'; ctx.font = '11px sans-serif'; ctx.fillText(p.score, x-10, y-10);
        });
    }

    async function loadHistory(type) {
        const sec = document.getElementById('historySection');
        const body = document.getElementById('historyBody');
        const res = await fetch(API + '/history?type=' + type + '&limit=10', {headers: headers()});
        const data = await res.json();
        if (!data.data || !data.data.items.length) { sec.style.display = 'none'; return; }
        sec.style.display = 'block';
        body.innerHTML = '';
        for (const item of data.data.items) {
            const sc = item.score || 0;
            const cls = sc >= 75 ? 'score-high' : sc >= 55 ? 'score-mid' : 'score-low';
            const tr = document.createElement('tr');
            tr.innerHTML = '<td>' + (item.paper_title||'--') + '</td>' +
                '<td>' + (item.qid||'--') + '</td>' +
                '<td><span class="score-badge ' + cls + '">' + sc + '</span></td>' +
                '<td>' + (item.created_at||'').substring(0,16) + '</td>';
            body.appendChild(tr);
        }
    }

    // init
    if (!token) { window.location.href = '/'; } else { loadStats(); }
    </script>
</body>
</html>
