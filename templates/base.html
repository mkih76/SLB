<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}申论帮 - AI智能申论批改平台{% endblock %}</title>
  <meta name="description" content="{% block description %}申论帮，AI驱动的申论批改平台。提供五种题型智能批改、好词好句学习、薄弱点追踪、备考计划等功能，助你高效备考公务员申论考试。{% endblock %}">
  <meta name="keywords" content="{% block keywords %}申论批改,AI批改,公务员考试,申论练习,申论评分,国考,省考{% endblock %}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://slb.19990419.top{{ request.path }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{% block og_title %}申论帮 - AI智能申论批改平台{% endblock %}">
  <meta property="og:description" content="{% block og_description %}AI驱动的申论批改，五种题型智能评分，助你高效备考{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://slb.19990419.top{{ request.path }}">

  <!-- Fonts: Inter + Noto Sans SC -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <!-- GSAP + ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- Lenis 平滑滚动 -->
  <script src="https://unpkg.com/lenis@latest/dist/lenis.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css', v=5) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/interactions.css', v=5) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css', v=5) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css', v=5) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/glass.css', v=5) }}">

  {% block extra_css %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <!-- 导航栏 -->
  <nav class="navbar" aria-label="主导航">
    <a href="/" class="navbar-brand">
      <span class="brand-dot" aria-hidden="true"></span>
      申论帮
    </a>

    <ul class="navbar-menu" id="navbar-menu-mobile">
      <li><a href="/" class="{% if request.path == '/' %}active{% endif %}">首页</a></li>
      <li><a href="/papers" class="{% if request.path == '/papers' %}active{% endif %}">卷库</a></li>
      <li><a href="/drill" class="{% if request.path == '/drill' %}active{% endif %}">题型训练</a></li>
      <li><a href="/diagnosis" class="{% if request.path == '/diagnosis' %}active{% endif %}">能力诊断</a></li>
      <li><a href="/phrases/study" class="{% if request.path.startswith('/phrases') %}active{% endif %}">素材学习</a></li>
      <li><a href="/plan" class="{% if request.path == '/plan' %}active{% endif %}">备考计划</a></li>
      <li><a href="/topics" class="{% if request.path == '/topics' %}active{% endif %}">时政热点</a></li>
      <li><a href="/community" class="{% if request.path == '/community' %}active{% endif %}">社区</a></li>
      <li><a href="/demo" class="{% if request.path == '/demo' %}active{% endif %}">试用</a></li>
      <!-- 移动端登录按钮（桌面端隐藏） -->
      <li class="mobile-auth-item">
        <span id="signin-area-mobile" class="hidden">
          <button id="signin-btn-mobile" class="btn btn-ghost btn-block" onclick="doSignIn()">签到</button>
        </span>
        <span id="user-info-mobile">
          <a href="/login" id="login-btn-mobile" class="btn btn-ghost btn-block">登录</a>
        </span>
      </li>
    </ul>

    <!-- 桌面端登录按钮 -->
    <div class="navbar-user">
      <span id="signin-area" class="hidden mr-2">
        <button id="signin-btn" class="btn btn-ghost btn-sm" onclick="doSignIn()">签到</button>
      </span>
      <span id="user-info">
        <a href="/login" id="login-btn" class="btn btn-ghost">登录</a>
      </span>
    </div>

    <!-- 移动端汉堡菜单按钮 -->
    <button class="navbar-toggle" aria-label="打开菜单" aria-expanded="false" aria-controls="navbar-menu-mobile">
      <span class="navbar-toggle-icon" aria-hidden="true"></span>
    </button>
  </nav>

  <!-- 主体内容 -->
  <main id="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p class="text-sm text-muted">&copy; 2024-2026 申论帮 - AI智能批改平台 | 让申论学习更高效</p>
    </div>
  </footer>

  <!-- Toast 容器 -->
  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <!-- 登录模态框 -->
  <div id="auth-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="auth-modal-title" class="modal-title">登录</h3>
        <button class="modal-close" onclick="closeAuthModal()" aria-label="关闭">&times;</button>
      </div>
      <div id="auth-form-container">
        <form id="modal-login-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" for="modal-login-username">用户名</label>
            <input type="text" id="modal-login-username" name="username" class="input-field" required>
            <p id="modal-login-username-error" class="form-error hidden" role="alert"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="modal-login-password">密码</label>
            <input type="password" id="modal-login-password" name="password" class="input-field" required>
            <p id="modal-login-password-error" class="form-error hidden" role="alert"></p>
          </div>
          <div id="login-error" class="form-error hidden" role="alert"></div>
          <button type="submit" class="btn btn-primary btn-block">登录</button>
          <p class="text-center mt-2 text-sm">
            还没有账号？<a href="#" onclick="switchToRegister(event)">立即注册</a>
          </p>
        </form>

        <form id="modal-register-form" class="hidden" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label class="form-label" for="modal-reg-username">用户名</label>
            <input type="text" id="modal-reg-username" name="username" class="input-field" required minlength="3">
            <p id="modal-reg-username-error" class="form-error hidden" role="alert"></p>
          </div>
          <div class="form-group">
            <label class="form-label" for="modal-reg-nickname">昵称</label>
            <input type="text" id="modal-reg-nickname" name="nickname" class="input-field">
          </div>
          <div class="form-group">
            <label class="form-label" for="modal-reg-password">密码</label>
            <input type="password" id="modal-reg-password" name="password" class="input-field" required minlength="6">
            <p id="modal-reg-password-error" class="form-error hidden" role="alert"></p>
          </div>
          <div id="register-error" class="form-error hidden" role="alert"></div>
          <button type="submit" class="btn btn-primary btn-block">注册</button>
          <p class="text-center mt-2 text-sm">
            已有账号？<a href="#" onclick="switchToLogin(event)">立即登录</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Lenis 平滑滚动
    try {
      const lenis = new Lenis({ duration: 1.2, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), smoothWheel: true });
      function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
      requestAnimationFrame(raf);
      document.querySelectorAll('a[href^="#"]').forEach(a => {
        a.addEventListener('click', e => {
          const id = a.getAttribute('href');
          if (id.length > 1) { e.preventDefault(); lenis.scrollTo(id); }
        });
      });
    } catch(e) { /* lenis 加载失败时静默降级 */ }

    // XSS防护：HTML转义工具函数
    function escapeHtml(str) {
      if (str == null) return '';
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(String(str)));
      return div.innerHTML;
    }

    // 全局状态
    const state = {
      user: null,
      token: localStorage.getItem('slb_token')
    };

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
      if (state.token) {
        fetchUserInfo();
      }
      lucide.createIcons();
      // 装饰性图标对屏幕阅读器隐藏（图标旁均有文字说明）
      document.querySelectorAll('svg.lucide').forEach(svg => {
        if (!svg.getAttribute('aria-hidden')) svg.setAttribute('aria-hidden', 'true');
      });

      // 移动菜单 aria-expanded 同步
      const navToggle = document.querySelector('.navbar-toggle');
      const navMenu = document.getElementById('navbar-menu-mobile');
      if (navToggle && navMenu) {
        navToggle.addEventListener('click', () => {
          const open = navMenu.classList.contains('open');
          navToggle.setAttribute('aria-expanded', String(!open));
          navToggle.setAttribute('aria-label', open ? '打开菜单' : '关闭菜单');
        });
        navMenu.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', () => {
            navToggle.setAttribute('aria-expanded', 'false');
            navToggle.setAttribute('aria-label', '打开菜单');
          });
        });
      }
    });

    // 获取用户信息
    async function fetchUserInfo() {
      try {
        const res = await fetch('/api/auth/me', {
          headers: { 'Authorization': 'Bearer ' + state.token }
        });
        if (res.ok) {
          const { data } = await res.json();
          state.user = data;
          updateUserUI();
        } else {
          logout();
        }
      } catch (e) {
        console.error('Failed to fetch user info:', e);
      }
    }

    // 更新用户UI
    function updateUserUI() {
      const userInfo = document.getElementById('user-info');
      const userInfoMobile = document.getElementById('user-info-mobile');
      const signinArea = document.getElementById('signin-area');
      const signinAreaMobile = document.getElementById('signin-area-mobile');

      if (state.user) {
        const vipBadge = state.user.is_vip ? '<span class="badge badge-accent">VIP</span>' : '';

        // 桌面端
        userInfo.innerHTML = `
          <a href="/profile" class="btn btn-ghost btn-sm mr-1">${state.user.nickname} ${vipBadge}</a>
          <a href="#" onclick="logout()" class="btn btn-ghost btn-sm opacity-70">退出</a>
        `;

        // 移动端
        if (userInfoMobile) {
          userInfoMobile.innerHTML = `
            <a href="/profile" class="btn btn-ghost btn-block">${state.user.nickname} ${vipBadge}</a>
            <a href="#" onclick="logout()" class="btn btn-ghost btn-block mt-2 opacity-70">退出</a>
          `;
        }

        if (signinArea) signinArea.classList.remove('hidden');
        if (signinAreaMobile) signinAreaMobile.classList.remove('hidden');
        checkSignInStatus();
      } else {
        if (signinArea) signinArea.classList.add('hidden');
        if (signinAreaMobile) signinAreaMobile.classList.add('hidden');
      }
    }

    // 签到
    async function doSignIn() {
      if (!state.token) { openAuthModal('login'); return; }
      try {
        const res = await fetch('/api/auth/signin', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + state.token }
        });
        const data = await res.json();
        if (res.ok) {
          showToast(data.data.message, 'success');
          const btn = document.getElementById('signin-btn');
          btn.textContent = '已签到';
          btn.disabled = true;
          btn.classList.add('opacity-70');
        } else {
          showToast(data.error, 'error');
        }
      } catch (e) {
        showToast('签到失败', 'error');
      }
    }

    // 检查签到状态
    async function checkSignInStatus() {
      if (!state.token) return;
      try {
        const res = await fetch('/api/auth/signin/status', {
          headers: { 'Authorization': 'Bearer ' + state.token }
        });
        if (res.ok) {
          const { data } = await res.json();
          const btn = document.getElementById('signin-btn');
          if (data.signed_today) {
            btn.textContent = '已签到';
            btn.disabled = true;
            btn.classList.add('opacity-70');
          }
        }
      } catch (e) { /* ignore */ }
    }

    // 登录
    async function handleLogin(e) {
      e.preventDefault();
      const form = e.target;
      const errorDiv = document.getElementById('login-error');

      const setFieldErr = (id, msg) => {
        const input = document.getElementById(id);
        const err = document.getElementById(id + '-error');
        if (msg) { input.classList.add('error'); err.textContent = msg; err.classList.remove('hidden'); }
        else { input.classList.remove('error'); err.classList.add('hidden'); }
      };

      const username = form.username.value.trim();
      const password = form.password.value;
      let valid = true;
      if (!username) { setFieldErr('modal-login-username', '请输入用户名'); valid = false; } else { setFieldErr('modal-login-username', ''); }
      if (!password) { setFieldErr('modal-login-password', '请输入密码'); valid = false; } else { setFieldErr('modal-login-password', ''); }
      if (!valid) return;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok) {
          state.token = data.data.token;
          state.user = data.data;
          localStorage.setItem('slb_token', state.token);
          closeAuthModal();
          updateUserUI();
          showToast('登录成功', 'success');
        } else {
          errorDiv.textContent = data.error;
          errorDiv.classList.remove('hidden');
          setFieldErr('modal-login-username', '');
          setFieldErr('modal-login-password', '');
        }
      } catch (e) {
        errorDiv.textContent = '登录失败，请稍后重试';
        errorDiv.classList.remove('hidden');
      }
    }

    // 注册
    async function handleRegister(e) {
      e.preventDefault();
      const form = e.target;
      const errorDiv = document.getElementById('register-error');

      const setFieldErr = (id, msg) => {
        const input = document.getElementById(id);
        const err = document.getElementById(id + '-error');
        if (msg) { input.classList.add('error'); err.textContent = msg; err.classList.remove('hidden'); }
        else { input.classList.remove('error'); err.classList.add('hidden'); }
      };

      const username = form.username.value.trim();
      const password = form.password.value;
      let valid = true;
      if (!username) { setFieldErr('modal-reg-username', '请输入用户名'); valid = false; } else { setFieldErr('modal-reg-username', ''); }
      if (!password) { setFieldErr('modal-reg-password', '请输入密码'); valid = false; } else { setFieldErr('modal-reg-password', ''); }
      if (!valid) return;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username,
            password,
            nickname: form.nickname.value
          })
        });

        const data = await res.json();
        if (res.ok) {
          state.token = data.data.token;
          state.user = data.data;
          localStorage.setItem('slb_token', state.token);
          closeAuthModal();
          updateUserUI();
          showToast('注册成功', 'success');
        } else {
          errorDiv.textContent = data.error;
          errorDiv.classList.remove('hidden');
          setFieldErr('modal-reg-username', '');
          setFieldErr('modal-reg-password', '');
        }
      } catch (e) {
        errorDiv.textContent = '注册失败，请稍后重试';
        errorDiv.classList.remove('hidden');
      }
    }

    // 登出
    function logout() {
      state.user = null;
      state.token = null;
      localStorage.removeItem('slb_token');
      updateUserUI();
      showToast('已退出登录', 'success');
    }

    // 登录模态框焦点管理
    function trapFocus(container) {
      const focusables = container.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      if (focusables.length === 0) return;
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      container.addEventListener('keydown', function handler(e) {
        if (e.key !== 'Tab') return;
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      });
    }
    let lastFocusedElement = null;

    // 模态框控制
    function openAuthModal(mode = 'login') {
      const modal = document.getElementById('auth-modal');
      modal.style.display = 'flex';
      lastFocusedElement = document.activeElement;
      if (mode === 'login') {
        switchToLogin();
      } else {
        switchToRegister();
      }
      const firstInput = modal.querySelector('input:not(.hidden)');
      if (firstInput) setTimeout(() => firstInput.focus(), 50);
      trapFocus(modal);
    }

    function closeAuthModal() {
      const modal = document.getElementById('auth-modal');
      modal.style.display = 'none';
      if (lastFocusedElement && typeof lastFocusedElement.focus === 'function') {
        lastFocusedElement.focus();
      }
    }

    function switchToLogin(e) {
      if (e) e.preventDefault();
      document.getElementById('modal-login-form').classList.remove('hidden');
      document.getElementById('modal-register-form').classList.add('hidden');
      document.getElementById('auth-modal-title').textContent = '登录';
    }

    function switchToRegister(e) {
      if (e) e.preventDefault();
      document.getElementById('modal-login-form').classList.add('hidden');
      document.getElementById('modal-register-form').classList.remove('hidden');
      document.getElementById('auth-modal-title').textContent = '注册';
    }

    // Toast 提示
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // 打开登录弹窗
    document.getElementById('login-btn')?.addEventListener('click', (e) => {
      e.preventDefault();
      openAuthModal('login');
    });

    // 点击模态框外部关闭 + Esc 关闭
    document.getElementById('auth-modal')?.addEventListener('click', (e) => {
      if (e.target.id === 'auth-modal') {
        closeAuthModal();
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const modal = document.getElementById('auth-modal');
        if (modal.style.display === 'flex') closeAuthModal();
      }
    });
  </script>

  {% block extra_js %}{% endblock %}

  <!-- 组件库 JS -->
  <script src="{{ url_for('static', filename='js/components.js', v=5) }}"></script>

  <!-- GSAP 动画 -->
  <script src="{{ url_for('static', filename='js/gsap-animations.js', v=5) }}"></script>

  <!-- 返回顶部按钮 -->
  <button class="back-to-top" aria-label="返回顶部">
    <svg class="back-to-top-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 15l-6-6-6 6"/>
    </svg>
  </button>

</body>
</html>
