{% extends "base.html" %}

{% block title %}批改结果 - 申论帮{% endblock %}

{% block content %}
<div class="page-container">
  <div class="container">
    <div style="text-align: center; margin-bottom: var(--space-4);">
      <h1>批改结果</h1>
      <p id="paper-info" style="color: var(--color-text-secondary);"></p>
    </div>

    <!-- 分数卡片 -->
    <div class="card" style="text-align: center; margin-bottom: var(--space-4);">
      <div style="font-size: 72px; font-weight: 700; color: var(--color-primary);" id="total-score">
        --
      </div>
      <p style="color: var(--color-text-secondary);">总分（满分100分）</p>
    </div>

    <!-- 维度得分 -->
    <div class="card" style="margin-bottom: var(--space-4);">
      <h3 style="margin-bottom: var(--space-3);">各维度得分</h3>
      <div id="dimension-scores">
        <!-- 动态渲染 -->
      </div>
    </div>

    <!-- 得分要点 -->
    <div class="grid" style="grid-template-columns: 1fr 1fr; gap: var(--space-3); margin-bottom: var(--space-4);">
      <div class="card" style="border-left: 4px solid var(--color-success);">
        <h4 style="color: var(--color-success); margin-bottom: var(--space-2);">
          <i data-lucide="check-circle"></i>
          命中要点
        </h4>
        <ul id="hit-points" style="padding-left: var(--space-3); color: var(--color-text-secondary);">
        </ul>
      </div>
      <div class="card" style="border-left: 4px solid var(--color-error);">
        <h4 style="color: var(--color-error); margin-bottom: var(--space-2);">
          <i data-lucide="x-circle"></i>
          遗漏要点
        </h4>
        <ul id="missing-points" style="padding-left: var(--space-3); color: var(--color-text-secondary);">
        </ul>
      </div>
    </div>

    <!-- AI反馈 -->
    <div class="card" style="margin-bottom: var(--space-4);">
      <h3 style="margin-bottom: var(--space-2);">
        <i data-lucide="message-square"></i>
        AI批改意见
      </h3>
      <div id="ai-feedback" style="line-height: 1.8; color: var(--color-text-secondary);">
        加载中...
      </div>
    </div>

    <!-- 改进建议 -->
    <div class="card" style="margin-bottom: var(--space-4);">
      <h3 style="margin-bottom: var(--space-2);">
        <i data-lucide="lightbulb"></i>
        改进建议
      </h3>
      <div id="improving-suggestions" style="line-height: 1.8; color: var(--color-text-secondary);">
        加载中...
      </div>
    </div>

    <!-- 用户答案 -->
    <div class="card" style="margin-bottom: var(--space-4);">
      <h3 style="margin-bottom: var(--space-2);">
        <i data-lucide="file-text"></i>
        你的答案
      </h3>
      <div id="user-answer" style="line-height: 1.8; white-space: pre-wrap; padding: var(--space-3); background: var(--color-bg); border-radius: var(--radius-md);">
      </div>
    </div>

    <!-- 操作按钮 -->
    <div style="display: flex; gap: var(--space-2); justify-content: center;">
      <button class="btn btn-secondary" onclick="submitFeedback()">
        <i data-lucide="flag"></i>
        认为批改有误？
      </button>
      <a href="/papers" class="btn btn-primary">
        <i data-lucide="arrow-right"></i>
        继续练习
      </a>
    </div>

    <!-- 纠错表单 -->
    <div id="feedback-form" class="card" style="display: none; margin-top: var(--space-4);">
      <h4>提交纠错</h4>
      <textarea id="feedback-text" class="input-field" style="height: 100px; margin: var(--space-2) 0;"
        placeholder="请说明你认为批改有误的原因..."></textarea>
      <button class="btn btn-primary" onclick="sendFeedback()">提交</button>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const sid = '{{ sid }}';

  async function loadResult() {
    if (!state.token) {
      alert('请先登录');
      window.location.href = '/';
      return;
    }

    try {
      const res = await fetch(`/api/submissions/${sid}`, {
        headers: { 'Authorization': 'Bearer ' + state.token }
      });

      if (!res.ok) {
        alert('加载失败');
        return;
      }

      const { data } = await res.json();
      renderResult(data);
    } catch (e) {
      console.error(e);
      alert('加载失败');
    }
  }

  function renderResult(data) {
    document.getElementById('paper-info').textContent = data.paper_title;
    document.getElementById('total-score').textContent = data.score !== null ? Math.round(data.score) : '--';

    // 用户答案
    document.getElementById('user-answer').textContent = data.user_answer;

    // 维度得分
    if (data.dimension_scores) {
      const dims = data.dimension_scores;
      const maxScores = { '踩点命中': 40, '逻辑结构': 25, '语言规范': 20, '字数控制': 10, '卷面整洁': 5 };
      document.getElementById('dimension-scores').innerHTML = Object.entries(dims).map(([key, value]) => `
        <div style="display: flex; align-items: center; margin-bottom: var(--space-2);">
          <span style="width: 100px;">${key}</span>
          <div style="flex: 1; height: 8px; background: var(--color-bg); border-radius: 4px; margin: 0 var(--space-2);">
            <div style="width: ${(value / maxScores[key]) * 100}%; height: 100%; background: var(--color-primary); border-radius: 4px;"></div>
          </div>
          <span style="width: 60px; text-align: right;">${value}/${maxScores[key]}</span>
        </div>
      `).join('');
    }

    // 命中要点
    if (data.hit_points && data.hit_points.length > 0) {
      document.getElementById('hit-points').innerHTML = data.hit_points.map(p => `<li>${p}</li>`).join('');
    } else {
      document.getElementById('hit-points').innerHTML = '<li>无</li>';
    }

    // 遗漏要点
    if (data.missing_points && data.missing_points.length > 0) {
      document.getElementById('missing-points').innerHTML = data.missing_points.map(p => `<li>${p}</li>`).join('');
    } else {
      document.getElementById('missing-points').innerHTML = '<li>无</li>';
    }

    // AI反馈
    document.getElementById('ai-feedback').textContent = data.ai_feedback || '暂无反馈';

    // 改进建议
    document.getElementById('improving-suggestions').textContent = data.improving_suggestions || '暂无建议';

    lucide.createIcons();
  }

  function submitFeedback() {
    const form = document.getElementById('feedback-form');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
  }

  async function sendFeedback() {
    const text = document.getElementById('feedback-text').value.trim();
    if (!text) {
      alert('请输入纠错内容');
      return;
    }

    try {
      const res = await fetch(`/api/submissions/${sid}/feedback`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + state.token
        },
        body: JSON.stringify({ text })
      });

      if (res.ok) {
        alert('感谢反馈，我们会尽快核实');
        document.getElementById('feedback-form').style.display = 'none';
      } else {
        alert('提交失败');
      }
    } catch (e) {
      alert('提交失败');
    }
  }

  loadResult();
</script>
{% endblock %}
