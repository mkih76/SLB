{% extends "base.html" %}
{% block title %}时政热点 - 申论帮{% endblock %}

{% block extra_css %}
<style>
  .topics-container { max-width: 900px; margin: 0 auto; padding: var(--space-8) var(--space-6); }
  .topics-header { text-align: center; margin-bottom: var(--space-8); }
  .topics-header h1 { font-size: var(--text-2xl); color: var(--color-primary); }
  .section-title { font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--color-primary); margin-bottom: var(--space-4); padding-bottom: var(--space-2); border-bottom: 2px solid var(--color-primary); }
  .stats-bar { display: flex; justify-content: center; gap: var(--space-8); margin-bottom: var(--space-8); }
  .stat-item { text-align: center; }
  .stat-num { font-size: var(--text-3xl); font-weight: var(--weight-bold); color: var(--color-primary); }
  .stat-label { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: var(--space-1); }
  .filter-bar { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-5); }
  .filter-btn { padding: var(--space-1) var(--space-4); border: 1px solid var(--color-gray-300); border-radius: var(--radius-full); background: var(--color-bg-elevated); font-size: var(--text-xs); cursor: pointer; transition: all 0.2s; }
  .filter-btn:hover, .filter-btn.active { border-color: var(--color-primary); color: var(--color-primary); background: var(--color-primary-light); }
  .topic-list { margin-bottom: var(--space-6); }
  .topic-card { padding: var(--space-4) var(--space-5); margin-bottom: var(--space-3); cursor: pointer; transition: all 0.2s; display: block; text-decoration: none; color: inherit; }
  .topic-card:hover { border-color: var(--color-primary); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .topic-card .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2); }
  .topic-badge { display: inline-block; padding: 2px 10px; border-radius: var(--radius-sm); font-size: var(--text-xs); font-weight: var(--weight-semibold); color: #fff; }
  .badge-shiping { background: var(--color-primary); }
  .badge-lilun { background: #722ed1; }
  .badge-dangjian { background: var(--color-error); }
  .badge-xuexi { background: #eb2f96; }
  .badge-jingji { background: var(--color-primary); }
  .badge-shehui { background: var(--color-success); }
  .badge-wenhua { background: #722ed1; }
  .badge-shengtai { background: #13c2c2; }
  .badge-minsheng { background: var(--color-warning); }
  .badge-zhili { background: var(--color-gray-700); }
  .badge-keji { background: #eb2f96; }
  .topic-title { font-size: var(--text-base); font-weight: var(--weight-semibold); color: var(--color-gray-800); margin-bottom: var(--space-1); }
  .topic-summary { font-size: var(--text-sm); color: var(--color-text-secondary); line-height: var(--leading-relaxed); margin-bottom: var(--space-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .topic-footer { display: flex; gap: var(--space-4); font-size: var(--text-xs); color: var(--color-text-muted); }
  .prob-high { color: var(--color-error); font-weight: var(--weight-semibold); }
  .prob-medium { color: var(--color-warning); font-weight: var(--weight-semibold); }
  .prob-low { color: var(--color-success); }
  .keyword-tag { display: inline-block; background: var(--color-primary-light); color: var(--color-primary); padding: 2px 10px; border-radius: var(--radius-sm); font-size: var(--text-xs); margin: 2px 4px 2px 0; }
</style>
{% endblock %}

{% block content %}
<div class="page-container">
  <div class="topics-container">
    <div class="topics-header reveal">
      <h1>时政热点专题</h1>
      <p class="text-muted">系统积累，精准押题</p>
    </div>

    <div class="stats-bar reveal" id="statsBar">
      <div class="stat-item glass" style="padding: var(--space-4) var(--space-6);"><div class="stat-num" id="statTotal">-</div><div class="stat-label">总专题</div></div>
      <div class="stat-item glass" style="padding: var(--space-4) var(--space-6);"><div class="stat-num" id="statRead">-</div><div class="stat-label">已学习</div></div>
      <div class="stat-item glass" style="padding: var(--space-4) var(--space-6);"><div class="stat-num" id="statUnread">-</div><div class="stat-label">未学习</div></div>
      <div class="stat-item glass" style="padding: var(--space-4) var(--space-6);"><div class="stat-num" id="statBookmark">-</div><div class="stat-label">已收藏</div></div>
    </div>

    <div class="section-title reveal">全部热点</div>
    <div class="filter-bar reveal" id="filterBar">
      <button class="filter-btn active" onclick="filterByCategory('', this)">全部</button>
      <button class="filter-btn" onclick="filterByCategory('xuexi', this)">学习强国</button>
      <button class="filter-btn" onclick="filterByCategory('shiping', this)">时评</button>
      <button class="filter-btn" onclick="filterByCategory('lilun', this)">理论</button>
      <button class="filter-btn" onclick="filterByCategory('dangjian', this)">党建</button>
    </div>

    <div class="topic-list reveal-stagger" id="topicList"><div class="empty-state"><div class="spinner"></div></div></div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const API = '/api/topics';
const token = localStorage.getItem('slb_token');
const headers = () => ({'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'});
let currentCategory = '';

async function loadStats() {
  if (!token) return;
  const res = await fetch(API + '/stats', {headers: headers()});
  const data = await res.json();
  if (!data.data) return;
  const s = data.data;
  document.getElementById('statTotal').textContent = s.total_topics;
  document.getElementById('statRead').textContent = s.read_count;
  document.getElementById('statUnread').textContent = s.unread_count;
  document.getElementById('statBookmark').textContent = s.bookmark_count;
}

async function loadTopics(page = 1) {
  const params = new URLSearchParams({page, limit: 20});
  if (currentCategory) params.append('category', currentCategory);
  const h = token ? headers() : {'Content-Type': 'application/json'};
  const res = await fetch(API + '?' + params, {headers: h});
  const data = await res.json();
  if (!data.data) return;
  const list = document.getElementById('topicList');
  const items = data.data.items || [];
  if (!items.length) { list.innerHTML = '<div class="empty-state">暂无热点专题</div>'; return; }
  list.innerHTML = items.map(t => {
    const probCls = t.probability === '高' ? 'prob-high' : t.probability === '中' ? 'prob-medium' : 'prob-low';
    return '<a class="card topic-card" href="/topics/' + t.topic_id + '">' +
      '<div class="top-row">' +
        '<span class="topic-badge badge-' + t.category + '">' + escapeHtml(t.category_name) + '</span>' +
        (t.probability ? '<span class="' + probCls + '">考试概率：' + t.probability + '</span>' : '') +
      '</div>' +
      '<div class="topic-title">' + escapeHtml(t.title) + '</div>' +
      '<div class="topic-summary">' + escapeHtml(t.summary) + '</div>' +
      '<div class="topic-footer">' +
        (t.keywords || []).slice(0, 3).map(k => '<span>' + escapeHtml(k) + '</span>').join(' · ') +
        (t.related_count ? '<span>关联真题 ' + t.related_count + ' 道</span>' : '') +
      '</div>' +
    '</a>';
  }).join('');
}

function filterByCategory(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadTopics();
}

loadStats(); loadTopics();
</script>
{% endblock %}
