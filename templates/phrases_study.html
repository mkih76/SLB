<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>素材学习 - 申论帮</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .study-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .study-header { text-align: center; margin-bottom: 30px; }
        .study-header h1 { font-size: 24px; color: #1A3A6B; }
        .stats-bar { display: flex; justify-content: center; gap: 32px; margin-bottom: 30px; }
        .stat-item { text-align: center; }
        .stat-num { font-size: 28px; font-weight: 700; color: #1A3A6B; }
        .stat-label { font-size: 13px; color: #999; margin-top: 4px; }
        .section-title { font-size: 18px; font-weight: 600; color: #1A3A6B; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #1A3A6B; }

        /* 素材卡片 */
        .card-area { margin-bottom: 30px; }
        .phrase-card {
            background: #fff; border: 1px solid #e8e8e8; border-radius: 12px;
            padding: 28px; margin-bottom: 16px; position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .phrase-card .new-badge {
            position: absolute; top: 12px; right: 12px;
            background: #C9A84C; color: #fff; padding: 2px 10px; border-radius: 4px;
            font-size: 12px; font-weight: 600;
        }
        .phrase-text { font-size: 20px; font-weight: 600; color: #333; line-height: 1.6; margin-bottom: 12px; }
        .phrase-meta { font-size: 13px; color: #999; margin-bottom: 8px; }
        .phrase-translation { font-size: 15px; color: #555; line-height: 1.8; margin-bottom: 8px; }
        .phrase-usage { font-size: 14px; color: #666; padding: 8px 12px; background: #f8f8f8; border-radius: 6px; margin-bottom: 16px; }
        .mastery-btns { display: flex; gap: 10px; }
        .mastery-btns button {
            flex: 1; padding: 10px; border: 2px solid #e8e8e8; border-radius: 8px;
            background: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .mastery-btns button:hover { border-color: #1A3A6B; }
        .mastery-btns .btn-new { color: #f5222d; border-color: #ffa39e; }
        .mastery-btns .btn-know { color: #fa8c16; border-color: #ffd591; }
        .mastery-btns .btn-familiar { color: #1890ff; border-color: #91d5ff; }
        .mastery-btns .btn-mastered { color: #52c41a; border-color: #b7eb8f; }

        .empty-card { text-align: center; padding: 60px 20px; color: #999; }
        .empty-card p { font-size: 16px; margin-bottom: 8px; }

        /* 掌握度分布 */
        .dist-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin: 12px 0; }
        .dist-bar .d0 { background: #f5222d; }
        .dist-bar .d1 { background: #fa8c16; }
        .dist-bar .d2 { background: #1890ff; }
        .dist-bar .d3 { background: #52c41a; }
        .dist-legend { display: flex; gap: 16px; font-size: 13px; color: #666; margin-bottom: 20px; }
        .dist-legend span { display: flex; align-items: center; gap: 4px; }
        .dist-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

        /* 素材包 */
        .pack-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 30px; }
        .pack-card {
            background: #fff; border: 1px solid #e8e8e8; border-radius: 8px;
            padding: 16px; cursor: pointer; transition: all 0.2s;
        }
        .pack-card:hover { border-color: #1A3A6B; box-shadow: 0 2px 8px rgba(26,58,107,0.1); }
        .pack-name { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 4px; }
        .pack-count { font-size: 12px; color: #999; }

        .btn-generate {
            display: inline-block; background: #C9A84C; color: #fff; border: none;
            padding: 10px 24px; border-radius: 6px; cursor: pointer; font-size: 15px;
            text-decoration: none;
        }
        .btn-generate:hover { background: #b8972e; }
    </style>
</head>
<body>
    <div class="study-container">
        <div class="study-header">
            <h1>素材学习</h1>
            <p style="color:#666;">间隔重复，科学记忆</p>
        </div>

        <!-- 统计栏 -->
        <div class="stats-bar" id="statsBar">
            <div class="stat-item"><div class="stat-num" id="statDue">-</div><div class="stat-label">今日待学</div></div>
            <div class="stat-item"><div class="stat-num" id="statMastered">-</div><div class="stat-label">已掌握</div></div>
            <div class="stat-item"><div class="stat-num" id="statTotal">-</div><div class="stat-label">总库存</div></div>
        </div>

        <!-- 掌握度分布 -->
        <div id="distSection" style="display:none;">
            <div class="section-title">掌握度分布</div>
            <div class="dist-bar" id="distBar"></div>
            <div class="dist-legend">
                <span><span class="dist-dot" style="background:#f5222d;"></span> 新学</span>
                <span><span class="dist-dot" style="background:#fa8c16;"></span> 认识</span>
                <span><span class="dist-dot" style="background:#1890ff;"></span> 熟悉</span>
                <span><span class="dist-dot" style="background:#52c41a;"></span> 掌握</span>
            </div>
        </div>

        <!-- 今日学习卡片 -->
        <div class="section-title">今日学习</div>
        <div class="card-area" id="cardArea">
            <div class="empty-card"><p>加载中...</p></div>
        </div>
        <div style="text-align:center; margin-bottom:30px;">
            <button class="btn-generate" onclick="loadCards()">换一批</button>
        </div>

        <!-- 素材包推荐 -->
        <div class="section-title">素材包</div>
        <div class="pack-grid" id="packGrid"></div>

        <!-- AI 造段入口 -->
        <div style="text-align:center; margin: 30px 0;">
            <a href="/phrases/generate" class="btn-generate">AI 造段 - 输入论点生成示范段落</a>
        </div>
    </div>

    <script>
    const API = '/api/phrases';
    const token = localStorage.getItem('token');
    const headers = () => ({'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'});

    let cards = [];
    let cardIdx = 0;

    async function loadStats() {
        const res = await fetch(API + '/study/stats', {headers: headers()});
        const data = await res.json();
        if (!data.data) return;
        const s = data.data;
        document.getElementById('statDue').textContent = s.due_today;
        document.getElementById('statMastered').textContent = s.mastered;
        document.getElementById('statTotal').textContent = s.total_phrases;

        // 掌握度分布
        const dist = s.distribution || {};
        const vals = [dist['新学']||0, dist['认识']||0, dist['熟悉']||0, dist['掌握']||0];
        const total = vals.reduce((a,b) => a+b, 0);
        if (total > 0) {
            document.getElementById('distSection').style.display = 'block';
            document.getElementById('distBar').innerHTML =
                vals.map((v, i) => '<div class="d' + i + '" style="width:' + (v/total*100) + '%;"></div>').join('');
        }
    }

    async function loadCards() {
        const res = await fetch(API + '/study/cards?limit=5', {headers: headers()});
        const data = await res.json();
        cards = data.data?.cards || [];
        cardIdx = 0;
        renderCard();
    }

    function renderCard() {
        const area = document.getElementById('cardArea');
        if (!cards.length || cardIdx >= cards.length) {
            area.innerHTML = '<div class="empty-card"><p>今日素材已全部学完</p><p style="font-size:14px;">明天再来复习吧</p></div>';
            return;
        }
        const c = cards[cardIdx];
        const tags = tryParseJson(c.tag);
        area.innerHTML =
            '<div class="phrase-card">' +
                (c.is_new ? '<span class="new-badge">新素材</span>' : '') +
                '<div class="phrase-text">' + escapeHtml(c.phrase) + '</div>' +
                '<div class="phrase-meta">' + escapeHtml(c.source||'') +
                    (c.source_date ? ' · ' + escapeHtml(c.source_date) : '') +
                    (tags.length ? ' · ' + tags.join(' / ') : '') + '</div>' +
                (c.translation ? '<div class="phrase-translation">' + escapeHtml(c.translation) + '</div>' : '') +
                (c.usage ? '<div class="phrase-usage">适用：' + escapeHtml(c.usage) + '</div>' : '') +
                '<div class="mastery-btns">' +
                    '<button class="btn-new" onclick="answer(0)">不认识</button>' +
                    '<button class="btn-know" onclick="answer(1)">认识</button>' +
                    '<button class="btn-familiar" onclick="answer(2)">熟悉</button>' +
                    '<button class="btn-mastered" onclick="answer(3)">掌握</button>' +
                '</div>' +
            '</div>';
    }

    async function answer(level) {
        const c = cards[cardIdx];
        await fetch(API + '/study/record', {
            method: 'POST',
            headers: headers(),
            body: JSON.stringify({phrase_id: c.phrase_id, mastery_level: level})
        });
        cardIdx++;
        renderCard();
        loadStats();
    }

    async function loadPacks() {
        const res = await fetch(API + '/packs?limit=10', {headers: headers()});
        const data = await res.json();
        const grid = document.getElementById('packGrid');
        const items = data.data?.items || [];
        if (!items.length) { grid.innerHTML = '<p style="color:#999;">暂无素材包</p>'; return; }
        grid.innerHTML = items.map(p =>
            '<div class="pack-card" onclick="viewPack(' + p.id + ')">' +
                '<div class="pack-name">' + escapeHtml(p.name) + '</div>' +
                '<div class="pack-count">' + (p.phrase_count||0) + ' 条素材</div>' +
            '</div>'
        ).join('');
    }

    function viewPack(id) {
        window.open('/api/phrases/packs/' + id, '_blank');
    }

    function tryParseJson(s) { try { return JSON.parse(s || '[]'); } catch { return []; } }
    function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    if (!token) { window.location.href = '/'; } else { loadStats(); loadCards(); loadPacks(); }
    </script>
</body>
</html>
