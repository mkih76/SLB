{% extends "base.html" %}
{% block title %}AI造段 - 申论帮{% endblock %}

{% block extra_css %}
<style>
  .gen-container { max-width: 800px; margin: 0 auto; padding: var(--space-8) var(--space-6); }
  .gen-header { text-align: center; margin-bottom: var(--space-8); }
  .gen-header h1 { font-size: var(--text-2xl); color: var(--color-primary); }
  .section-title { font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--color-primary); margin-bottom: var(--space-4); padding-bottom: var(--space-2); border-bottom: 2px solid var(--color-primary); }
  .result-area { padding: var(--space-7); margin-top: var(--space-6); display: none; }
  .result-paragraph { font-size: var(--text-base); line-height: var(--leading-loose); color: var(--color-gray-800); margin-bottom: var(--space-4); white-space: pre-wrap; }
  .result-meta { font-size: var(--text-xs); color: var(--color-text-muted); margin-bottom: var(--space-4); }
  .result-actions { display: flex; gap: var(--space-3); }
  .used-phrases { margin-top: var(--space-4); padding: var(--space-3); background: var(--color-gray-50); border-radius: var(--radius-md); }
  .used-phrases .label { font-size: var(--text-xs); color: var(--color-text-secondary); margin-bottom: var(--space-2); }
  .phrase-tag { display: inline-block; background: var(--color-primary-light); color: var(--color-primary); padding: 2px 10px; border-radius: var(--radius-sm); font-size: var(--text-xs); margin: 2px 4px 2px 0; }
  .loading-spinner { text-align: center; padding: var(--space-10); color: var(--color-text-muted); display: none; }
</style>
{% endblock %}

{% block content %}
<div class="page-container">
  <div class="gen-container">
    <div class="gen-header reveal">
      <h1>AI 造段</h1>
      <p class="text-muted">输入论点，AI 自动匹配素材生成示范段落</p>
    </div>

    <div class="card reveal" style="padding: var(--space-6);">
      <div class="section-title">输入信息</div>
      <div class="form-group">
        <label class="form-label">你的论点</label>
        <textarea class="input-field" id="pointInput" placeholder="例如：科技创新是推动高质量发展的第一动力"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">主题</label>
        <select class="input-field" id="themeSelect">
          <option value="科技创新">科技创新</option>
          <option value="乡村振兴">乡村振兴</option>
          <option value="基层治理">基层治理</option>
          <option value="民生保障">民生保障</option>
          <option value="生态文明">生态文明</option>
          <option value="文化建设">文化建设</option>
          <option value="经济发展">经济发展</option>
          <option value="法治建设">法治建设</option>
          <option value="人才发展">人才发展</option>
          <option value="通用">通用</option>
        </select>
      </div>
      <button class="btn btn-primary" style="width:100%;" id="btnGen" onclick="generate()">生成示范段落</button>
    </div>

    <div class="loading-spinner" id="loadingSpinner">
      <div class="spinner"></div>
      <p>AI 正在生成中，请稍候...</p>
    </div>

    <div class="result-area glass" id="resultArea">
      <div class="section-title">生成结果</div>
      <div class="result-paragraph" id="resultParagraph"></div>
      <div class="result-meta" id="resultMeta"></div>
      <div class="used-phrases" id="usedPhrases" style="display:none;">
        <div class="label">使用了以下素材：</div>
        <div id="phraseTags"></div>
      </div>
      <div class="result-actions">
        <button class="btn btn-secondary" onclick="copyText()">复制段落</button>
        <button class="btn btn-accent" onclick="generate()">换一批素材重新生成</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const API = '/api/phrases';
const token = localStorage.getItem('slb_token');
const headers = () => ({'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'});

async function generate() {
  const point = document.getElementById('pointInput').value.trim();
  if (!point) { showToast('请输入论点', 'error'); return; }
  const theme = document.getElementById('themeSelect').value;
  const btn = document.getElementById('btnGen');
  btn.disabled = true; btn.classList.add('btn-loading');
  document.getElementById('loadingSpinner').style.display = 'block';
  document.getElementById('resultArea').style.display = 'none';
  try {
    const res = await fetch(API + '/generate', { method: 'POST', headers: headers(), body: JSON.stringify({point, theme}) });
    const data = await res.json();
    if (data.error) { showToast(data.error, 'error'); return; }
    renderResult(data.data);
  } catch (e) {
    showToast('生成失败：' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.classList.remove('btn-loading');
    document.getElementById('loadingSpinner').style.display = 'none';
  }
}

function renderResult(r) {
  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultParagraph').textContent = r.paragraph || '';
  document.getElementById('resultMeta').textContent = '主题：' + (r.theme||'') + ' | 素材池：' + (r.phrases_pool_count||0) + ' 条';
  const used = r.used_phrases || [];
  const upDiv = document.getElementById('usedPhrases');
  if (used.length) {
    upDiv.style.display = 'block';
    document.getElementById('phraseTags').innerHTML = used.map(p => '<span class="phrase-tag">' + escapeHtml(p) + '</span>').join('');
  } else { upDiv.style.display = 'none'; }
}

function copyText() {
  const text = document.getElementById('resultParagraph').textContent;
  navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = text;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); showToast('已复制到剪贴板');
  });
}

// 页面可自由访问，提交时才需要登录
</script>
{% endblock %}
