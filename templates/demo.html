{% extends "base.html" %}

{% block title %}免注册试用 - 申论帮{% endblock %}

{% block extra_css %}
<style>
  .demo-header { text-align: center; margin-bottom: var(--space-4); }
  .demo-header p { color: var(--color-text-secondary); }
  .demo-section { margin-bottom: var(--space-4); }
  .demo-papers { margin-top: var(--space-3); }
  .demo-paper-card { cursor: pointer; }
  .demo-paper-meta { color: var(--color-text-secondary); font-size: var(--text-sm); margin: 0; }
  .demo-split { display: grid; grid-template-columns: 1fr; gap: var(--space-4); margin-top: var(--space-3); }
  @media (min-width: 768px) { .demo-split { grid-template-columns: 1fr 1fr; } }
  .demo-pane-title { margin-bottom: var(--space-2); }
  .demo-material {
    padding: var(--space-3);
    background: var(--color-bg);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-md);
    line-height: 1.8;
    max-height: 480px;
    overflow-y: auto;
    font-size: var(--text-sm);
  }
  .demo-stem { margin-bottom: var(--space-2); line-height: var(--lh-relaxed); }
  .demo-word-limit { color: var(--color-text-secondary); margin-bottom: var(--space-2); font-size: var(--text-sm); }
  .demo-answer { height: 200px; resize: vertical; }
  .demo-count-row { margin-top: var(--space-2); text-align: right; font-size: var(--text-sm); color: var(--color-text-secondary); }
  .demo-score-box { text-align: center; margin: var(--space-4) 0; }
  .demo-score { font-size: 64px; font-weight: 700; line-height: 1; background: var(--gradient-primary); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
  .demo-feedback {
    padding: var(--space-3);
    background: var(--color-bg);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-md);
    font-size: var(--text-sm);
    line-height: 1.8;
  }
  .demo-feedback ul { list-style: disc; padding-left: var(--space-5); }
  .demo-feedback p { margin-top: var(--space-2); }
  .demo-actions { text-align: center; margin-top: var(--space-4); display: flex; gap: var(--space-3); justify-content: center; flex-wrap: wrap; }
</style>
{% endblock %}

{% block content %}
<div class="page-container">
  <div class="container">
    <div class="demo-header">
      <h1>免注册试用</h1>
      <p>体验完整批改流程，登录后可保存记录</p>
    </div>

    <!-- 选择试卷 -->
    <div class="card demo-section">
      <h3>选择示范卷</h3>
      <div id="demo-papers" class="grid grid-3 demo-papers">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

    <!-- 作答区 -->
    <div id="demo-exam-section" class="card demo-section hidden">
      <h3 id="demo-paper-title"></h3>
      <div class="demo-split">
        <div>
          <h4 class="demo-pane-title">给定材料</h4>
          <div id="demo-material" class="demo-material"></div>
        </div>
        <div>
          <h4 class="demo-pane-title">题目</h4>
          <p id="demo-stem" class="demo-stem"></p>
          <p id="demo-word-limit" class="demo-word-limit"></p>
          <textarea id="demo-answer" class="input-field demo-answer" placeholder="请输入答案..."></textarea>
          <div class="demo-count-row">
            <span>字数：<span id="demo-count">0</span></span>
          </div>
          <button class="btn btn-primary btn-block mt-2" onclick="submitDemo()">
            <i data-lucide="send"></i>
            提交批改
          </button>
        </div>
      </div>
    </div>

    <!-- 结果区 -->
    <div id="demo-result" class="card demo-section hidden">
      <h3>批改结果</h3>
      <div class="demo-score-box">
        <div class="demo-score" id="demo-score">--</div>
        <p>总分（满分100分）</p>
      </div>
      <div id="demo-feedback" class="demo-feedback"></div>
      <div class="demo-actions">
        <a href="#" onclick="location.reload(); return false;" class="btn btn-secondary">重新体验</a>
        <button class="btn btn-primary" onclick="openAuthModal('register')">登录保存记录</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  let selectedPaper = null;
  let selectedQuestion = null;

  async function loadDemoPapers() {
    try {
      const res = await fetch('/api/papers?limit=3');
      const { data } = await res.json();

      const container = document.getElementById('demo-papers');
      if (data.papers && data.papers.length > 0) {
        container.innerHTML = data.papers.map(paper => {
          const questions = parseQuestions(paper.questions);
          const safePid = escapeHtml(paper.pid);
          const safeQid = escapeHtml(questions[0]?.qid || 'q1');
          const safeTitle = escapeHtml(paper.title);
          const safeExamType = escapeHtml(paper.exam_type);
          const safeYear = escapeHtml(paper.year);
          return `
            <div class="card demo-paper-card" onclick="selectPaper('${safePid}', '${safeQid}')">
              <h4>${safeTitle}</h4>
              <p class="demo-paper-meta">${safeExamType} | ${safeYear}</p>
            </div>
          `;
        }).join('');
      } else {
        container.innerHTML = '<p class="empty-state">暂无示范卷</p>';
      }
      lucide.createIcons();
    } catch (e) {
      document.getElementById('demo-papers').innerHTML = '<p class="empty-state">加载失败</p>';
    }
  }

  async function selectPaper(pid, qid) {
    try {
      const [paperRes, qRes] = await Promise.all([
        fetch(`/api/papers/${pid}`),
        fetch(`/api/papers/${pid}/question/${qid}`)
      ]);

      const { data: paper } = await paperRes.json();
      const { data: question } = await qRes.json();

      selectedPaper = paper;
      selectedQuestion = question;

      document.getElementById('demo-paper-title').textContent = paper.title;
      document.getElementById('demo-material').textContent = (question.material || []).join('\n\n');
      document.getElementById('demo-stem').textContent = question.stem;
      document.getElementById('demo-word-limit').textContent = '字数要求：' + (question.word_limit || '未指定');

      document.getElementById('demo-exam-section').classList.remove('hidden');
      document.getElementById('demo-result').classList.add('hidden');

      lucide.createIcons();
    } catch (e) {
      alert('加载失败');
    }
  }

  document.getElementById('demo-answer')?.addEventListener('input', function() {
    document.getElementById('demo-count').textContent = this.value.length;
  });

  async function submitDemo() {
    const answer = document.getElementById('demo-answer').value.trim();
    if (!answer) {
      alert('请输入答案');
      return;
    }

    if (!selectedPaper || !selectedQuestion) {
      alert('请先选择试卷');
      return;
    }

    const btn = document.querySelector('#demo-exam-section .btn-primary');
    btn.classList.add('btn-loading');
    btn.textContent = '批改中...';

    try {
      const res = await fetch('/api/papers/demo/grade', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          pid: selectedPaper.pid,
          qid: selectedQuestion.qid,
          user_answer: answer
        })
      });

      const { data, error } = await res.json();

      if (!res.ok) {
        alert(error || '批改失败，请稍后重试');
        return;
      }

      const score = Math.round(data.score || 0);
      const dims = data.dimension_scores || {};

      document.getElementById('demo-score').textContent = score;
      document.getElementById('demo-feedback').innerHTML = `
        <p><strong>各维度得分：</strong></p>
        <ul>
          ${Object.entries(dims).map(([k, v]) => `<li>${escapeHtml(k)}：${escapeHtml(v)}分</li>`).join('')}
        </ul>
        ${data.hit_points && data.hit_points.length > 0 ? `<p><strong>命中要点：</strong>${data.hit_points.map(p => escapeHtml(p)).join('、')}</p>` : ''}
        ${data.missing_points && data.missing_points.length > 0 ? `<p><strong>遗漏要点：</strong>${data.missing_points.map(p => escapeHtml(p)).join('、')}</p>` : ''}
        <p><strong>AI评语：</strong>${escapeHtml(data.ai_feedback || '暂无评语')}</p>
        ${data.improving_suggestions ? `<p><strong>改进建议：</strong>${escapeHtml(data.improving_suggestions)}</p>` : ''}
      `;

      document.getElementById('demo-exam-section').classList.add('hidden');
      document.getElementById('demo-result').classList.remove('hidden');
    } catch (e) {
      alert('网络错误，请稍后重试');
    } finally {
      btn.classList.remove('btn-loading');
      btn.textContent = '提交批改';
    }
  }

  function parseQuestions(questionsJson) {
    try {
      return JSON.parse(questionsJson);
    } catch {
      return [];
    }
  }

  loadDemoPapers();
</script>
{% endblock %}
