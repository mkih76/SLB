{% extends "base.html" %}
{% block title %}能力诊断 - 申论帮{% endblock %}

{% block extra_css %}
<style>
  .diag-container { max-width: 900px; margin: 0 auto; padding: var(--space-8) var(--space-6); }
  .diag-header { text-align: center; margin-bottom: var(--space-8); }
  .diag-header h1 { font-size: var(--text-2xl); color: var(--color-primary); }
  .overall-score { text-align: center; margin-bottom: var(--space-8); }
  .score-circle { display: inline-flex; align-items: center; justify-content: center; width: 120px; height: 120px; border-radius: 50%; background: var(--color-primary); color: #fff; font-size: var(--text-4xl); font-weight: var(--weight-bold); box-shadow: 0 8px 24px rgba(30,58,95,0.2); }
  .score-label { font-size: var(--text-sm); color: var(--color-text-muted); margin-top: var(--space-2); }
  .section-title { font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--color-primary); margin-bottom: var(--space-4); padding-bottom: var(--space-2); border-bottom: 2px solid var(--color-primary); }
  .dim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-8); }
  .dim-card { padding: var(--space-4); }
  .dim-label { font-size: var(--text-xs); color: var(--color-text-secondary); margin-bottom: var(--space-2); }
  .dim-bar { height: 8px; background: var(--color-gray-200); border-radius: var(--radius-full); overflow: hidden; }
  .dim-fill { height: 100%; border-radius: var(--radius-full); transition: width 0.5s; }
  .dim-value { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--color-gray-800); margin-top: var(--space-1); float: right; }
  .type-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-3); margin-bottom: var(--space-8); }
  .type-card { padding: var(--space-4); text-align: center; }
  .type-name { font-size: var(--text-xs); color: var(--color-text-secondary); }
  .type-score { font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--color-primary); margin: var(--space-1) 0; }
  .sw-section { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5); margin-bottom: var(--space-8); }
  .sw-card { padding: var(--space-4); }
  .sw-title { font-size: var(--text-sm); font-weight: var(--weight-semibold); margin-bottom: var(--space-3); }
  .sw-title.strength { color: var(--color-success); }
  .sw-title.weakness { color: var(--color-error); }
  .sw-item { font-size: var(--text-sm); color: var(--color-gray-700); padding: var(--space-1) 0; border-bottom: 1px solid var(--color-gray-100); }
  .rec-list { margin-bottom: var(--space-8); }
  .rec-item { padding: var(--space-3) var(--space-4); margin-bottom: var(--space-2); display: flex; align-items: center; gap: var(--space-3); }
  .rec-badge { padding: 2px 8px; border-radius: var(--radius-sm); font-size: var(--text-xs); font-weight: var(--weight-semibold); color: #fff; }
  .rec-high { background: var(--color-error); }
  .rec-medium { background: var(--color-warning); }
  .rec-low { background: var(--color-success); }
  .rec-text { font-size: var(--text-sm); color: var(--color-gray-700); }
  .trend-chart { padding: var(--space-5); margin-bottom: var(--space-8); }
  @media (max-width: 768px) { .dim-grid, .sw-section { grid-template-columns: 1fr; } .type-grid { grid-template-columns: repeat(3, 1fr); } }
</style>
{% endblock %}

{% block content %}
<div class="page-container">
  <div class="diag-container">
    <div class="diag-header reveal">
      <h1>能力诊断报告</h1>
      <p class="text-muted" id="reportTime"></p>
    </div>

    <div id="loadingState" class="empty-state"><div class="spinner"></div></div>

    <div id="emptyState" class="empty-state" style="display:none;">
      <p>暂无诊断报告</p>
      <p class="text-caption">完成一次练习后，系统将自动生成你的能力诊断报告</p>
      <button class="btn btn-primary mt-4" onclick="generateReport()">立即生成报告</button>
    </div>

    <div id="reportContent" style="display:none;">
      <div class="overall-score reveal">
        <div class="score-circle" id="overallScore">--</div>
        <div class="score-label">综合得分</div>
      </div>

      <div class="section-title reveal">能力维度</div>
      <div class="dim-grid reveal-stagger" id="dimGrid"></div>

      <div class="section-title reveal">题型得分</div>
      <div class="type-grid reveal-stagger" id="typeGrid"></div>

      <div class="sw-section reveal">
        <div class="card sw-card">
          <div class="sw-title strength">你的优势</div>
          <div id="strengthsList"></div>
        </div>
        <div class="card sw-card">
          <div class="sw-title weakness">你的短板</div>
          <div id="weaknessesList"></div>
        </div>
      </div>

      <div class="section-title reveal">下一步建议</div>
      <div class="rec-list reveal-stagger" id="recList"></div>

      <div class="section-title reveal">得分趋势</div>
      <div class="trend-chart glass reveal">
        <canvas id="trendCanvas" width="860" height="200"></canvas>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const API = '/api/diagnosis';
const token = localStorage.getItem('slb_token');
const headers = () => ({'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'});
const dimNames = {point_coverage:'踩点命中',logic_structure:'逻辑结构',language:'语言表达',format:'格式规范',word_count:'字数控制'};
const typeNames = {guina:'归纳概括',zonghe:'综合分析',duice:'提出对策',zhixing:'贯彻执行',zuowen:'大作文'};
const dimMax = {point_coverage:40,logic_structure:25,language:20,format:5,word_count:10};

async function loadReport() {
  try {
    const res = await fetch(API + '/latest', {headers: headers()});
    const data = await res.json();
    if (!data.data || data.error) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('emptyState').style.display = 'block';
      return;
    }
    renderReport(data.data);
  } catch(e) {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('emptyState').style.display = 'block';
  }
}

function renderReport(r) {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('reportContent').style.display = 'block';
  document.getElementById('reportTime').textContent = '报告时间：' + (r.created_at||'').substring(0,16);
  document.getElementById('overallScore').textContent = r.overall_score || '--';

  const dimGrid = document.getElementById('dimGrid');
  dimGrid.innerHTML = '';
  const dims = r.dimension_scores || {};
  for (const [k,label] of Object.entries(dimNames)) {
    const val = dims[k] || 0;
    const max = dimMax[k] || 20;
    const pct = Math.min(100, (val/max)*100);
    const color = pct >= 75 ? 'var(--color-success)' : pct >= 50 ? 'var(--color-warning)' : 'var(--color-error)';
    dimGrid.innerHTML += '<div class="card dim-card"><div class="dim-label">' + label +
      '<span class="dim-value">' + val + '/' + max + '</span></div>' +
      '<div class="dim-bar"><div class="dim-fill" style="width:' + pct + '%;background:' + color + '"></div></div></div>';
  }

  const typeGrid = document.getElementById('typeGrid');
  typeGrid.innerHTML = '';
  const types = r.type_scores || {};
  for (const [k,label] of Object.entries(typeNames)) {
    const val = types[k] ?? '--';
    typeGrid.innerHTML += '<div class="card type-card"><div class="type-name">' + label + '</div>' +
      '<div class="type-score">' + (typeof val === 'object' ? val.score : val) + '</div></div>';
  }

  renderList('strengthsList', r.strengths || [], '暂无数据');
  renderList('weaknessesList', r.weaknesses || [], '暂无数据');

  const recList = document.getElementById('recList');
  recList.innerHTML = '';
  const recs = r.recommendations || [];
  if (!recs.length) { recList.innerHTML = '<p class="text-muted">暂无建议</p>'; }
  recs.forEach(rec => {
    const p = rec.priority || 'medium';
    const cls = p === 'high' ? 'rec-high' : p === 'medium' ? 'rec-medium' : 'rec-low';
    recList.innerHTML += '<div class="card rec-item"><span class="rec-badge ' + cls + '">' + p.toUpperCase() + '</span>' +
      '<span class="rec-text">' + (rec.action||'') + '</span></div>';
  });

  if (r.score_trend && r.score_trend.length) drawTrend(r.score_trend);
}

function renderList(id, items, emptyText) {
  const el = document.getElementById(id);
  if (!items.length) { el.innerHTML = '<div class="text-muted text-sm" style="padding:8px 0;">' + emptyText + '</div>'; return; }
  el.innerHTML = items.map(i => '<div class="sw-item">' + escapeHtml(i) + '</div>').join('');
}

function drawTrend(trend) {
  const canvas = document.getElementById('trendCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.parentElement.clientWidth - 40;
  canvas.height = 200;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const max = 100, pad = 40;
  const w = canvas.width - pad*2, h = canvas.height - pad*2;
  ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad + (h/4)*i;
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(pad+w, y); ctx.stroke();
    ctx.fillStyle = '#9ca3af'; ctx.font = '11px sans-serif';
    ctx.fillText(Math.round(max - (max/4)*i), 5, y+4);
  }
  ctx.strokeStyle = '#1e3a5f'; ctx.lineWidth = 2; ctx.beginPath();
  trend.forEach((s, i) => {
    const x = pad + (w / Math.max(trend.length-1, 1)) * i;
    const y = pad + h - (s/max)*h;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
  trend.forEach((s, i) => {
    const x = pad + (w / Math.max(trend.length-1, 1)) * i;
    const y = pad + h - (s/max)*h;
    ctx.fillStyle = '#1e3a5f'; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#374151'; ctx.font = '11px sans-serif'; ctx.fillText(s, x-10, y-10);
  });
}

async function generateReport() {
  const res = await fetch(API + '/generate', {method:'POST', headers: headers()});
  const data = await res.json();
  if (data.data) { renderReport(data.data); }
  else { showToast(data.error || '生成失败，请先完成一次练习', 'error'); }
}

if (!token) { showToast('请先登录', 'error'); openAuthModal('login'); } else { loadReport(); }
</script>
{% endblock %}
