<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社区互助 - 申论帮</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .comm-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .comm-header { text-align: center; margin-bottom: 30px; }
        .comm-header h1 { font-size: 24px; color: #1A3A6B; }
        .section-title { font-size: 18px; font-weight: 600; color: #1A3A6B; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #1A3A6B; }

        /* 筛选栏 */
        .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn {
            padding: 6px 16px; border: 1px solid #d9d9d9; border-radius: 20px;
            background: #fff; font-size: 13px; cursor: pointer; transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active { border-color: #1A3A6B; color: #1A3A6B; background: #f0f5ff; }
        .sort-bar { display: flex; gap: 8px; margin-bottom: 20px; justify-content: flex-end; }
        .sort-btn {
            padding: 4px 12px; border: none; background: none; font-size: 13px;
            color: #999; cursor: pointer;
        }
        .sort-btn.active { color: #1A3A6B; font-weight: 600; }

        /* 精选区 */
        .featured-section { margin-bottom: 24px; }
        .featured-card {
            background: linear-gradient(135deg, #1A3A6B, #2a5298);
            color: #fff; border-radius: 12px; padding: 20px; margin-bottom: 12px;
            cursor: pointer; transition: transform 0.2s;
        }
        .featured-card:hover { transform: translateY(-2px); }
        .featured-badge { display: inline-block; background: #C9A84C; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-bottom: 8px; }
        .featured-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
        .featured-content { font-size: 14px; opacity: 0.9; margin-bottom: 8px; line-height: 1.6; }
        .featured-meta { font-size: 12px; opacity: 0.7; }

        /* 帖子列表 */
        .post-list { margin-bottom: 24px; }
        .post-card {
            background: #fff; border: 1px solid #e8e8e8; border-radius: 8px;
            padding: 16px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s;
        }
        .post-card:hover { border-color: #1A3A6B; box-shadow: 0 2px 8px rgba(26,58,107,0.08); }
        .post-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .post-type-badge {
            display: inline-block; padding: 2px 10px; border-radius: 4px;
            font-size: 12px; font-weight: 600; color: #fff;
        }
        .type-answer_share { background: #52c41a; }
        .type-question { background: #fa8c16; }
        .type-discussion { background: #1890ff; }
        .type-tips { background: #722ed1; }
        .post-nick { font-size: 13px; color: #999; }
        .post-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .post-content { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 8px; }
        .post-footer { display: flex; gap: 16px; font-size: 12px; color: #999; }
        .post-footer span { display: flex; align-items: center; gap: 4px; }
        .featured-star { color: #C9A84C; }

        /* 发帖表单 */
        .create-section { margin-bottom: 24px; }
        .create-toggle {
            display: block; width: 100%; padding: 12px; background: #f8f8f8;
            border: 1px dashed #d9d9d9; border-radius: 8px; text-align: center;
            color: #666; font-size: 15px; cursor: pointer; transition: all 0.2s;
        }
        .create-toggle:hover { border-color: #1A3A6B; color: #1A3A6B; }
        .create-form {
            background: #fff; border: 1px solid #e8e8e8; border-radius: 8px;
            padding: 20px; margin-top: 12px; display: none;
        }
        .form-row { display: flex; gap: 12px; margin-bottom: 12px; }
        .form-group { flex: 1; }
        .form-label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .input-field {
            width: 100%; border: 1px solid #d9d9d9; border-radius: 6px; padding: 10px 14px;
            font-size: 15px; font-family: inherit;
        }
        .input-field:focus { outline: none; border-color: #1A3A6B; }
        textarea.input-field { min-height: 120px; resize: vertical; line-height: 1.6; }
        select.input-field { cursor: pointer; }
        .btn-post { background: #1A3A6B; color: #fff; border: none; padding: 10px 28px; border-radius: 6px; font-size: 15px; cursor: pointer; }
        .btn-post:hover { background: #2a5298; }

        /* 详情弹窗 */
        .detail-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center; z-index: 200;
        }
        .detail-box {
            background: #fff; border-radius: 12px; max-width: 700px; width: 90%;
            max-height: 85vh; overflow-y: auto; padding: 32px;
        }
        .detail-close { float: right; background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
        .detail-title { font-size: 20px; font-weight: 700; color: #1A3A6B; margin-bottom: 12px; }
        .detail-meta { font-size: 13px; color: #999; margin-bottom: 16px; }
        .detail-content { font-size: 15px; line-height: 1.9; color: #333; margin-bottom: 20px; white-space: pre-wrap; }
        .detail-actions { display: flex; gap: 12px; margin-bottom: 20px; }
        .btn-like { padding: 6px 16px; border: 1px solid #d9d9d9; border-radius: 6px; background: #fff; cursor: pointer; font-size: 14px; }
        .btn-like.liked { border-color: #f5222d; color: #f5222d; }

        /* 评论区 */
        .comment-section { margin-top: 20px; border-top: 1px solid #e8e8e8; padding-top: 16px; }
        .comment-item { padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
        .comment-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .comment-nick { font-size: 13px; font-weight: 600; color: #333; }
        .comment-time { font-size: 12px; color: #999; }
        .comment-content { font-size: 14px; color: #555; line-height: 1.6; }
        .comment-form { display: flex; gap: 8px; margin-top: 12px; }
        .comment-form textarea { flex: 1; border: 1px solid #d9d9d9; border-radius: 6px; padding: 8px 12px; font-size: 14px; min-height: 60px; resize: vertical; font-family: inherit; }
        .comment-form button { align-self: flex-end; padding: 8px 20px; background: #1A3A6B; color: #fff; border: none; border-radius: 6px; cursor: pointer; }

        .empty-state { text-align: center; padding: 40px; color: #999; }
    </style>
</head>
<body>
    <div class="comm-container">
        <div class="comm-header">
            <h1>社区互助</h1>
            <p style="color:#666;">分享交流，共同进步</p>
        </div>

        <!-- 发帖 -->
        <div class="create-section">
            <div class="create-toggle" onclick="toggleCreate()">+ 发布新帖</div>
            <div class="create-form" id="createForm">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">帖子类型</label>
                        <select class="input-field" id="postType">
                            <option value="answer_share">晒答案</option>
                            <option value="question">求助</option>
                            <option value="discussion">讨论</option>
                            <option value="tips">备考经验</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">标题</label>
                        <input type="text" class="input-field" id="postTitle" placeholder="简短描述">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom:12px;">
                    <label class="form-label">内容</label>
                    <textarea class="input-field" id="postContent" placeholder="分享你的经验、提出你的问题..."></textarea>
                </div>
                <div style="display:flex;gap:8px;">
                    <button class="btn-post" onclick="submitPost()">发布</button>
                    <button class="btn-post" style="background:#f0f0f0;color:#333;" onclick="toggleCreate()">取消</button>
                </div>
            </div>
        </div>

        <!-- 精选 -->
        <div class="featured-section" id="featuredSection" style="display:none;">
            <div class="section-title">精选范文</div>
            <div id="featuredList"></div>
        </div>

        <!-- 筛选 -->
        <div class="section-title">社区帖子</div>
        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterType('')">全部</button>
            <button class="filter-btn" onclick="filterType('answer_share')">晒答案</button>
            <button class="filter-btn" onclick="filterType('question')">求助</button>
            <button class="filter-btn" onclick="filterType('discussion')">讨论</button>
            <button class="filter-btn" onclick="filterType('tips')">备考经验</button>
        </div>
        <div class="sort-bar">
            <button class="sort-btn active" onclick="changeSort('latest')">最新</button>
            <button class="sort-btn" onclick="changeSort('hot')">最热</button>
        </div>

        <!-- 帖子列表 -->
        <div class="post-list" id="postList">
            <div class="empty-state">加载中...</div>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div class="detail-overlay" id="detailOverlay" style="display:none;" onclick="closeDetail(event)">
        <div class="detail-box" id="detailBox" onclick="event.stopPropagation()">
            <button class="detail-close" onclick="document.getElementById('detailOverlay').style.display='none'">&times;</button>
            <div id="detailContent"></div>
        </div>
    </div>

    <script>
    const API = '/api/community';
    const token = localStorage.getItem('token');
    const headers = () => ({'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'});
    let currentType = '';
    let currentSort = 'latest';

    async function loadFeatured() {
        const res = await fetch(API + '/featured?limit=3');
        const data = await res.json();
        const items = data.data?.items || [];
        if (!items.length) return;
        document.getElementById('featuredSection').style.display = 'block';
        document.getElementById('featuredList').innerHTML = items.map(p =>
            '<div class="featured-card" onclick="viewPost(' + p.post_id + ')">' +
                '<span class="featured-badge">精选</span>' +
                '<div class="featured-title">' + escapeHtml(p.title || p.content.substring(0, 50)) + '</div>' +
                '<div class="featured-content">' + escapeHtml(p.content.substring(0, 100)) + '...</div>' +
                '<div class="featured-meta">' + escapeHtml(p.nickname) + ' · ' + p.like_count + '赞 · ' + p.comment_count + '评论</div>' +
            '</div>'
        ).join('');
    }

    async function loadPosts(page = 1) {
        const params = new URLSearchParams({page, limit: 20, sort: currentSort});
        if (currentType) params.append('type', currentType);
        const res = await fetch(API + '/posts?' + params);
        const data = await res.json();
        const list = document.getElementById('postList');
        const items = data.data?.items || [];
        if (!items.length) {
            list.innerHTML = '<div class="empty-state">暂无帖子</div>';
            return;
        }
        list.innerHTML = items.map(p => {
            const badgeCls = 'type-' + p.post_type;
            return '<div class="post-card" onclick="viewPost(' + p.post_id + ')">' +
                '<div class="post-top">' +
                    '<span class="post-type-badge ' + badgeCls + '">' + escapeHtml(p.post_type_name) + '</span>' +
                    '<span class="post-nick">' + escapeHtml(p.nickname) + '</span>' +
                '</div>' +
                (p.title ? '<div class="post-title">' + escapeHtml(p.title) + '</div>' : '') +
                '<div class="post-content">' + escapeHtml(p.content) + '</div>' +
                '<div class="post-footer">' +
                    (p.is_featured ? '<span class="featured-star">★ 精选</span>' : '') +
                    '<span>' + p.view_count + ' 浏览</span>' +
                    '<span>' + p.like_count + ' 赞</span>' +
                    '<span>' + p.comment_count + ' 评论</span>' +
                    '<span>' + timeAgo(p.created_at) + '</span>' +
                '</div>' +
            '</div>';
        }).join('');
    }

    function filterType(type) {
        currentType = type;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        loadPosts();
    }

    function changeSort(sort) {
        currentSort = sort;
        document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        loadPosts();
    }

    function toggleCreate() {
        const form = document.getElementById('createForm');
        form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }

    async function submitPost() {
        if (!token) { alert('请先登录'); return; }
        const post_type = document.getElementById('postType').value;
        const title = document.getElementById('postTitle').value.trim();
        const content = document.getElementById('postContent').value.trim();
        if (!content) { alert('请输入内容'); return; }

        const res = await fetch(API + '/posts', {
            method: 'POST', headers: headers(),
            body: JSON.stringify({post_type, title, content})
        });
        const data = await res.json();
        if (data.error) { alert(data.error); return; }
        alert('发布成功');
        toggleCreate();
        document.getElementById('postContent').value = '';
        document.getElementById('postTitle').value = '';
        loadPosts();
    }

    let currentPostId = null;

    async function viewPost(id) {
        currentPostId = id;
        const h = token ? headers() : {'Content-Type': 'application/json'};
        const res = await fetch(API + '/posts/' + id, {headers: h});
        const data = await res.json();
        if (!data.data) return;
        renderDetail(data.data);
        document.getElementById('detailOverlay').style.display = 'flex';
    }

    function renderDetail(p) {
        let html = '<div class="detail-title">' + escapeHtml(p.title || p.post_type_name) + '</div>';
        html += '<div class="detail-meta">' + escapeHtml(p.nickname) + ' · ' + timeAgo(p.created_at) +
            ' · ' + p.view_count + '浏览 · ' + p.like_count + '赞 · ' + p.comment_count + '评论</div>';
        html += '<div class="detail-content">' + escapeHtml(p.content) + '</div>';

        // 操作
        const likedCls = p.is_liked ? ' liked' : '';
        html += '<div class="detail-actions">';
        html += '<button class="btn-like' + likedCls + '" onclick="toggleLike(' + p.post_id + ')">👍 ' + (p.is_liked ? '已赞' : '赞') + ' ' + p.like_count + '</button>';
        html += '</div>';

        // 评论
        html += '<div class="comment-section">';
        html += '<h4 style="font-size:15px;margin-bottom:12px;">评论 (' + (p.comments || []).length + ')</h4>';
        (p.comments || []).forEach(c => {
            html += '<div class="comment-item">' +
                '<div class="comment-header"><span class="comment-nick">' + escapeHtml(c.nickname) + '</span>' +
                '<span class="comment-time">' + timeAgo(c.created_at) + '</span></div>' +
                '<div class="comment-content">' + escapeHtml(c.content) + '</div></div>';
        });
        if (token) {
            html += '<div class="comment-form">' +
                '<textarea id="commentInput" placeholder="写下你的评论..."></textarea>' +
                '<button onclick="submitComment(' + p.post_id + ')">发送</button></div>';
        }
        html += '</div>';

        document.getElementById('detailContent').innerHTML = html;
    }

    async function toggleLike(postId) {
        if (!token) { alert('请先登录'); return; }
        await fetch(API + '/post/' + postId + '/like', {method: 'POST', headers: headers()});
        viewPost(postId);
    }

    async function submitComment(postId) {
        const input = document.getElementById('commentInput');
        const content = input.value.trim();
        if (!content) return;
        await fetch(API + '/posts/' + postId + '/comments', {
            method: 'POST', headers: headers(),
            body: JSON.stringify({content})
        });
        input.value = '';
        viewPost(postId);
    }

    function closeDetail(e) {
        if (e.target === document.getElementById('detailOverlay'))
            document.getElementById('detailOverlay').style.display = 'none';
    }

    function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

    function timeAgo(dt) {
        if (!dt) return '';
        const diff = (Date.now() - new Date(dt).getTime()) / 1000;
        if (diff < 60) return '刚刚';
        if (diff < 3600) return Math.floor(diff/60) + '分钟前';
        if (diff < 86400) return Math.floor(diff/3600) + '小时前';
        if (diff < 604800) return Math.floor(diff/86400) + '天前';
        return dt.substring(0, 10);
    }

    loadFeatured();
    loadPosts();
    </script>
</body>
</html>
