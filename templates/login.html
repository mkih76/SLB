{% extends "base.html" %}

{% block title %}登录 - 申论帮{% endblock %}

{% block extra_css %}
<style>
  .auth-shell {
    min-height: calc(100vh - var(--navbar-height));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-6);
    background: linear-gradient(180deg, #f0f9ff 0%, var(--color-bg) 60%);
  }
  .auth-card { width: 100%; max-width: 400px; }
  .auth-logo {
    width: 52px;
    height: 52px;
    border-radius: var(--radius-xl);
    background: var(--gradient-primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto var(--space-4);
    font-size: var(--text-xl);
    font-weight: 700;
    box-shadow: 0 6px 16px rgba(14, 165, 233, 0.3);
  }
  .auth-heading { text-align: center; margin-bottom: var(--space-8); }
  .auth-heading h1 { font-size: var(--text-2xl); font-weight: 600; margin-bottom: var(--space-2); }
  .auth-heading p { color: var(--color-text-secondary); font-size: var(--text-sm); }
  .auth-form-card { padding: var(--space-8); }
  .auth-footer { margin-top: var(--space-6); text-align: center; }
  .auth-footer p { font-size: var(--text-sm); color: var(--color-text-secondary); }
  .auth-footer a { color: var(--color-primary); font-weight: 500; }
  .password-wrap { position: relative; }
  .password-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--color-text-muted);
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
  }
  .password-toggle:hover { color: var(--color-text); }
  .auth-error {
    display: none;
    color: var(--color-error);
    font-size: var(--text-sm);
    margin-bottom: var(--space-4);
    padding: var(--space-2) var(--space-3);
    background: var(--color-error-soft);
    border-radius: var(--radius-md);
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-heading">
      <div class="auth-logo">申</div>
      <h1>登录申论帮</h1>
      <p>AI 智能批改，助你高效备考</p>
    </div>

    <!-- 登录表单 -->
    <div class="card auth-form-card">
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">用户名</label>
          <input type="text" id="username" name="username" class="input-field" placeholder="请输入用户名" required autofocus>
          <p id="username-error" class="form-error hidden" role="alert"></p>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" class="input-field" placeholder="请输入密码" required>
            <button type="button" onclick="togglePassword()" class="password-toggle" aria-label="显示/隐藏密码">
              <i data-lucide="eye"></i>
            </button>
          </div>
          <p id="password-error" class="form-error hidden" role="alert"></p>
        </div>

        <div id="login-error" class="auth-error" role="alert"></div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          登录
        </button>
      </form>

      <div class="auth-footer">
        <p>
          还没有账号？<a href="/register">立即注册</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  // 切换密码可见性
  function togglePassword() {
    const input = document.getElementById('password');
    const icon = input.parentElement.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.setAttribute('data-lucide', 'eye-off');
    } else {
      input.type = 'password';
      icon.setAttribute('data-lucide', 'eye');
    }
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  }

  // 字段级错误设置
  function setFieldError(id, msg) {
    const input = document.getElementById(id);
    const err = document.getElementById(id + '-error');
    if (!input || !err) return;
    if (msg) {
      input.classList.add('error');
      err.textContent = msg;
      err.classList.remove('hidden');
    } else {
      input.classList.remove('error');
      err.classList.add('hidden');
    }
  }

  // 登录
  async function handleLogin(e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('login-error');
    const btn = e.target.querySelector('button[type="submit"]');

    // 字段级校验
    let valid = true;
    if (!username) { setFieldError('username', '请输入用户名'); valid = false; } else { setFieldError('username', ''); }
    if (!password) { setFieldError('password', '请输入密码'); valid = false; } else { setFieldError('password', ''); }
    if (!valid) return;

    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.classList.add('btn-loading');

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (res.ok && data.data) {
        // 保存 token（键名与 base.html 保持一致）
        localStorage.setItem('slb_token', data.data.token);
        localStorage.setItem('user', JSON.stringify(data.data.user));

        if (typeof SLBToast !== 'undefined') {
          SLBToast.success('登录成功');
        }

        // 跳转
        setTimeout(() => {
          window.location.href = '/';
        }, 500);
      } else {
        errorEl.textContent = data.error || '登录失败';
        errorEl.style.display = 'block';
        setFieldError('username', '');
        setFieldError('password', '');
        btn.disabled = false;
        btn.classList.remove('btn-loading');
        btn.textContent = '登录';
      }
    } catch (e) {
      console.error('Login error:', e);
      errorEl.textContent = '网络错误，请稍后重试';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.classList.remove('btn-loading');
      btn.textContent = '登录';
    }
  }
</script>
{% endblock %}
