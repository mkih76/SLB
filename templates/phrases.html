{% extends "base.html" %}

{% block title %}好词好句 - 申论帮{% endblock %}

{% block extra_css %}
<style>
  .phrases-title { margin-bottom: var(--space-4); }
  .filter-card { margin-bottom: var(--space-3); }
  .filter-row { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; }
  .filter-row .form-group { margin-bottom: 0; }
  .filter-row .input-field { width: auto; }
  .filter-row #filter-tag { width: 150px; }
  .phrase-card { margin-bottom: var(--space-2); }
  .phrase-head { display: flex; justify-content: space-between; align-items: start; }
  .phrase-main { flex: 1; min-width: 0; }
  .phrase-text { font-size: var(--text-lg); line-height: 1.8; margin-bottom: var(--space-2); }
  .phrase-line { color: var(--color-text-secondary); margin-bottom: var(--space-1); font-size: var(--text-sm); line-height: var(--lh-relaxed); }
  .phrase-meta { display: flex; gap: var(--space-2); align-items: center; margin-top: var(--space-2); flex-wrap: wrap; }
  .phrase-heat { color: var(--color-text-secondary); font-size: var(--text-sm); }
  .favorite-btn { margin-left: var(--space-2); flex-shrink: 0; }
  .pagination a, .pagination span.active {
    display: inline-block;
    padding: 6px 12px;
    margin: 0 2px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    font-size: var(--text-sm);
    color: var(--color-text-secondary);
    text-decoration: none;
  }
  .pagination a:hover { border-color: var(--color-primary); color: var(--color-primary); }
  .pagination span.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
</style>
{% endblock %}

{% block content %}
<div class="page-container">
  <div class="container">
    <h1 class="phrases-title">好词好句库</h1>

    <!-- 筛选栏 -->
    <div class="card filter-card">
      <div class="filter-row">
        <div class="form-group">
          <label class="form-label" for="filter-source">来源</label>
          <select id="filter-source" class="input-field">
            <option value="">全部</option>
            <option value="人民日报">人民日报</option>
            <option value="求是">求是</option>
            <option value="新华网">新华网</option>
            <option value="半月谈">半月谈</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="filter-tag">标签</label>
          <input type="text" id="filter-tag" class="input-field" placeholder="乡村振兴">
        </div>
        <button class="btn btn-primary" onclick="loadPhrases()">
          <i data-lucide="search"></i>
          搜索
        </button>
      </div>
    </div>

    <!-- 好词列表 -->
    <div id="phrases-list">
      <div class="loading">
        <div class="spinner"></div>
      </div>
    </div>

    <!-- 分页 -->
    <div id="pagination" class="pagination"></div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  let currentPage = 1;

  async function loadPhrases(page = 1) {
    currentPage = page;
    const source = document.getElementById('filter-source').value;
    const tag = document.getElementById('filter-tag').value;

    const params = new URLSearchParams({ page, limit: 20 });
    if (source) params.append('source', source);
    if (tag) params.append('tag', tag);

    try {
      const res = await fetch(`/api/phrases?${params}`);
      const { data } = await res.json();

      renderPhrases(data.phrases);
      renderPagination(data);
    } catch (e) {
      document.getElementById('phrases-list').innerHTML = '<p class="empty-state">加载失败</p>';
    }
  }

  function renderPhrases(phrases) {
    const container = document.getElementById('phrases-list');

    if (!phrases || phrases.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <i data-lucide="inbox"></i>
          <p>暂无好词好句</p>
        </div>
      `;
      lucide.createIcons();
      return;
    }

    container.innerHTML = phrases.map(phrase => {
      let tags = [];
      try { tags = JSON.parse(phrase.tag || '[]'); } catch(e) { tags = []; }
      const safePhrase = escapeHtml(phrase.phrase);
      const safeTrans = escapeHtml(phrase.translation || '');
      const safeUsage = escapeHtml(phrase.usage || '');
      const safeSource = escapeHtml(phrase.source || '未知');
      const safeHeat = escapeHtml(String(phrase.heat || 0));
      return `
        <div class="card phrase-card">
          <div class="phrase-head">
            <div class="phrase-main">
              <p class="phrase-text">${safePhrase}</p>
              ${safeTrans ? `<p class="phrase-line"><strong>解读：</strong>${safeTrans}</p>` : ''}
              ${safeUsage ? `<p class="phrase-line"><strong>适用场景：</strong>${safeUsage}</p>` : ''}
              <div class="phrase-meta">
                <span class="badge badge-info">${safeSource}</span>
                ${tags.map(t => `<span class="badge badge-neutral">${escapeHtml(t)}</span>`).join('')}
                <span class="phrase-heat">热度: ${safeHeat}</span>
              </div>
            </div>
            <button class="btn btn-secondary favorite-btn" onclick="favoritePhrase(${phrase.id})" aria-label="收藏">
              <i data-lucide="heart"></i>
            </button>
          </div>
        </div>
      `;
    }).join('');

    lucide.createIcons();
  }

  function renderPagination(data) {
    const container = document.getElementById('pagination');
    if (data.pages <= 1) {
      container.innerHTML = '';
      return;
    }

    let html = '';
    for (let i = 1; i <= data.pages; i++) {
      if (i === data.page) {
        html += `<span class="active">${i}</span>`;
      } else {
        html += `<a href="#" onclick="loadPhrases(${i}); return false;">${i}</a>`;
      }
    }
    container.innerHTML = html;
  }

  async function favoritePhrase(phraseId) {
    if (!state.token) {
      alert('请先登录');
      openAuthModal('login');
      return;
    }

    try {
      const res = await fetch(`/api/phrases/${phraseId}/favorite`, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + state.token }
      });

      if (res.ok) {
        showToast('已收藏', 'success');
      } else {
        const data = await res.json();
        showToast(data.error || '收藏失败', 'error');
      }
    } catch (e) {
      showToast('收藏失败', 'error');
    }
  }

  function escapeHtml(str) {
    if (str == null) return '';
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(String(str)));
    return div.innerHTML;
  }

  loadPhrases();
</script>
{% endblock %}
